
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | IMovies</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo">I<span>Movies</span></a>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#movies">Movies</a>
        <a href="my-bookings.html">My Bookings</a>
    </nav>

    <div class="nav-auth" id="navAuth">
        <a href="login.html" class="login-btn">Login</a>
    </div>
</header>

    <main class="auth-container">
        <div class="auth-card">
            <h1>Welcome Back!</h1>
            <p class="auth-subtitle">Login to your IMovies account</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <p id="loginMessage" class="auth-message"></p>

                <button type="submit" class="auth-btn">Login</button>
            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>

            <a href="index.html" class="back-home">← Back to Home</a>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 IMovies. All rights reserved.</p>
    </footer>

    <script src="login.js"></script>
    <script src="navbar.js"></script>
</body>
</html>
