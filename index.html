
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMovies - Movie Ticket Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">I<span>Movies</span></a>

        <nav>
            <a href="index.html">Home</a>
            <a href="#movies">Movies</a>
            <a href="#bookings">My Bookings</a>
        </nav>

        
        <div class="nav-auth" id="navAuth">
            <a href="login.html" class="login-btn">Login</a>
        </div>

    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <p class="tagline">YOUR CINEMA EXPERIENCE</p>
                <h1>Movies you'll love.<br>Moments you'll remember.</h1>
                <p class="hero-description">
                    Discover the latest movies and find your next
                    favourite cinematic experience.
                </p>
                <a href="#movies" class="primary-btn">Explore Movies</a>
            </div>
        </section>

        <section class="movies-section" id="movies">
            <div class="section-heading">
                <div>
                    <p class="tagline">NOW SHOWING</p>
                    <h2>Popular Movies</h2>
                </div>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search movies..."
                    aria-label="Search movies"
                >
            </div>

            <div class="movie-grid" id="movieGrid">
                <!-- Movie cards will be added using JavaScript. -->
            </div>
        </section>
    </main>

    <footer>
        <a href="index.html" class="logo">I<span>Movies</span></a>
        <p>Made for movie lovers. Your next story starts here.</p>
    </footer>

    <script src="script.js"></script>
    <script src="navbar.js"></script>
</body>
</html>
