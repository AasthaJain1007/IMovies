
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | IMovies</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

   
<header class="navbar">
    <a href="index.html" class="logo">I<span>Movies</span></a>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#movies">Movies</a>
        <a href="my-bookings.html">My Bookings</a>
    </nav>

    <div class="nav-auth" id="navAuth">
        <a href="login.html" class="login-btn">Login</a>
    </div>
</header>


    <main class="auth-container">
        <div class="auth-card">
            <h1>Create Account</h1>
            <p class="auth-subtitle">Join IMovies and book your favourite movies</p>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                        minlength="2"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password (minimum 6 characters)"
                        required
                        minlength="6"
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        required
                        minlength="6"
                    >
                </div>

                <p id="registerMessage" class="auth-message"></p>

                <button type="submit" class="auth-btn">Create Account</button>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

            <a href="index.html" class="back-home">← Back to Home</a>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 IMovies. All rights reserved.</p>
    </footer>

    <script src="register.js"></script>
    <script src="navbar.js"></script>
</body>
</html>
